[build]
  command = "npm run build"
  publish = "."
  
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com; connect-src 'self' https://cdnjs.cloudflare.com https://*.firebaseio.com wss://*.firebaseio.com https://*.googleapis.com;"
